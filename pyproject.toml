[project]
name = "buttery"
version = "0.1.0"
description = "Agent-friendly 2D explainer animations. The scene is a pure function of time."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "skia-python>=138",
    "numpy>=1.26",
    "mcp>=2.0",
]

[project.scripts]
buttery = "buttery.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buttery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
