[project]
site_url = "https://buttery.computer/"
site_name = "buttery"
site_description = "Buttery smooth, agent-friendly explainer animations in Python. The scene is a pure function of time."
site_author = "Fletcher Graham"
copyright = "Copyright &copy; 2026 Fletcher Graham"

repo_url = "https://github.com/fletchgraham/buttery"
repo_name = "fletchgraham/buttery"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Install" = "install.md" },
  { "Python" = "python.md" },
  { "Scenes" = "scenes.md" },
  { "Agents" = "agents.md" },
  { "Examples" = "examples.md" },
  { "Build your own" = "build-your-own.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
logo = "logo.png"
favicon = "logo.png"
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "deep orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "deep orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/fletchgraham/buttery"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/buttery/"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
